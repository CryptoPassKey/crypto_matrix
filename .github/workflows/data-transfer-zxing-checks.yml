name: Data Transfer ZXing production syntax

on:
  pull_request:
    paths:
      - "contents/data-transfer.js"
      - "contents/data-transfer-*.js"
      - "contents/sw.js"
      - ".github/workflows/data-transfer-zxing-checks.yml"
  push:
    branches:
      - main
    paths:
      - "contents/data-transfer.js"
      - "contents/data-transfer-*.js"
      - "contents/sw.js"
      - ".github/workflows/data-transfer-zxing-checks.yml"

jobs:
  production-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check production JavaScript syntax
        run: |
          node --check contents/data-transfer-protocol.js
          node --check contents/data-transfer-zxing-loader.js
          node --check contents/data-transfer-worker.js
          node --check contents/data-transfer.js
          node --check contents/sw.js
