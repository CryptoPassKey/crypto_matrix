name: Robin Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Robin AI review
        uses: antongulin/robin@c307d49e53284c3c0e05c9a764ab9e8cce6f7dff
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          # Keep reviews advisory; do not block merges with REQUEST_CHANGES.
          request-changes: "false"
          fail-on-high: "false"
          # Send only the PR diff to the model; do not enable repository snapshot/agent mode.
          agent-mode: "off"
          min-command-permission: "write"
