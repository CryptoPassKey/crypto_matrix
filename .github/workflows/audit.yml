name: Audits

on:
  pull_request:
    paths:
      - "contents/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "contents/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tests/package-lock.json"
      - name: Install audit dependencies
        run: npm --prefix tests ci
      - name: Check production JavaScript syntax
        run: |
          for f in contents/*.js; do
            node --check "$f"
          done
      - name: Contrast audit (WCAG 2.2 AA, static + dynamic DOM, both themes)
        run: node tests/accessibility/contrast-audit.js
      - name: Compatibility audit (existing encrypted backups must still decrypt)
        run: node tests/compatibility/compat-audit.js
      - name: Corrupt input rejection tests
        run: node tests/security/corrupt-input.test.js
      - name: Recover beacon info tests
        run: node tests/security/recover-beacon-info.test.js
      - name: Timelock beacon URL tests
        run: node tests/security/tl-beacon-url.test.js
      - name: Matrix board guard tests
        run: node tests/security/matrix-board-guard.test.js
      - name: Matrix letter-seed symbols tests
        run: node tests/security/matrix-letter-seed-symbols.test.js
      - name: Matrix numeric-seed restore compat tests
        run: node tests/security/matrix-numeric-restore-compat.test.js
      - name: Guide first-visit tests
        run: node tests/ui/guide-first-visit.test.js
      - name: Feature icons tests
        run: node tests/ui/feature-icons.test.js
      - name: Help popover tests
        run: node tests/ui/help-popover.test.js
      - name: TimeLock text triage tests
        run: node tests/ui/timelock-text-triage.test.js
      - name: Backup text triage tests
        run: node tests/ui/backup-text-triage.test.js
      - name: Vault text triage tests
        run: node tests/ui/vault-text-triage.test.js
      - name: TimeSecret text triage tests
        run: node tests/ui/timesecret-text-triage.test.js
      - name: Quick generation text triage tests
        run: node tests/ui/quick-text-triage.test.js
      - name: Data Transfer text triage tests
        run: node tests/ui/datatransfer-text-triage.test.js
      - name: Passkey identifier foundation tests
        run: node tests/security/passkey-id.test.js
      - name: Passkey storage migration tests
        run: node tests/security/passkey-migration.test.js
      - name: Passkey recovery context tests
        run: node tests/security/passkey-recovery-context.test.js
      - name: CSP static check
        run: node tests/security/csp-static-check.js
      - name: CSP policy check
        run: node tests/security/csp-policy-check.js
      - name: Clipboard auto-clear tests
        run: node tests/security/clipboard-clear.test.js
      - name: KeeWeb transfer deletion contract tests
        run: node tests/security/keeweb-transfer-deletion.test.js
      - name: Secure random ID tests
        run: node tests/security/secure-random-id.test.js
      - name: Zeroize clears Data Transfer receive state
        run: node tests/security/zeroize-dt-rx.test.js
      - name: Emergency zeroize coverage tests
        run: node tests/security/zeroize-coverage.test.js
      - name: Data Transfer buffer zeroize tests
        run: node tests/security/dt-buffer-zeroize.test.js
      - name: Zeroize clears TimeSecret ephemeral state
        run: node tests/security/zeroize-timesecret.test.js
