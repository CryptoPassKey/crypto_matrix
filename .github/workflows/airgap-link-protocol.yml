name: Airgap Link Protocol Tests

on:
  pull_request:
    paths:
      - "contents/test/airgap-link-*.js"
      - "contents/test/airgap-link-protocol.test.cjs"
      - ".github/workflows/airgap-link-protocol.yml"
  push:
    branches: [main]
    paths:
      - "contents/test/airgap-link-*.js"
      - "contents/test/airgap-link-protocol.test.cjs"
      - ".github/workflows/airgap-link-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol self-tests (Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check contents/test/airgap-link-core.js
          node --check contents/test/airgap-link-fountain.js
          node --check contents/test/airgap-link-ui.js
          node --check contents/test/airgap-link-ui-v2_1.js
          node --check contents/test/airgap-link-ui-v3.js
          node --check contents/test/airgap-link-ui-v4.js
          node --check contents/test/airgap-link-fountain-v5.js
          node --check contents/test/airgap-link-ui-v5.js
          node --check contents/test/airgap-link-ui-v6.js
          node --check contents/test/airgap-link-protocol.test.cjs

      - name: Run protocol tests
        run: node contents/test/airgap-link-protocol.test.cjs
