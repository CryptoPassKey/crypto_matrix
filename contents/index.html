<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts から Fira Code を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

    <script src="./jquery.js"></script>
    <script src="./index.js"></script>
    <title>crypto matrix</title>

<style>
    /* 正方形の四角形を作成 */
    .square {
        width: 10mm;
        height: 10mm;
        background-color: #FFFFFF;
        border: 1px dotted #747373;
        position: relative;
        z-index: 1;
    }

    /* 真ん中の大きめの文字 */
    .center-text {
        font-family: 'Fira Code', monospace;
        font-size: 7.2mm;
        color: #000000;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        line-height: 1;
    }

    /* 四隅の小さい文字 */
    .corner-text {
        font-family: 'Fira Code', monospace;
        font-size: 3.9mm;
        color: #000000;
        position: absolute;
        line-height: 1;
        background-color: #ffffff;
        z-index: 10;
        padding: 0 0.3mm;
    }

    /* 左上 */
    .top-left {
        top: -1.0mm;
        left: -1.0mm;
    }

    /* 右上 */
    .top-right {
        top: -1.0mm;
        right: -1.0mm;
    }

    /* 左下 */
    .bottom-left {
        bottom: -1.0mm;
        left: -1.0mm;
    }

    /* 右下 */
    .bottom-right {
        bottom: -1.0mm;
        right: -1.0mm;
    }
</style>
</head>
